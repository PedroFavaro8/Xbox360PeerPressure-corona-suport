; This ini file can be used to boot different operating systems, namely xell. In the softmod
; settings app you can change the boot-via-eject button behavior to either boot the system
; normally or boot one of the operating systems listed in this file.
;
; Each OS entry uses the category name "BootOption", and has the following keys:
;	Name - display name of the OS, ex: "Xell", "Linux", etc.
;
;	FileName - name (or file path relative to the OtherOS folder) of the OS bootloader binary, 
;		ex: "xell-2f.bin", "linux\xell.bin", etc.
;
;	BaseAddress - optional base address of the bootloader binary, if one is not specified the 
;		default address 0x800000001c040000 will be used which should be sufficient for xell-2f.bin
;		binaries. This address can be found in the linker script (.lds) file used to compiled
;		the binary.
;
;	BypassXellScanning - xell binaries have update/flash writing features meant for RGH consoles
;		and when used on a softmodded console can cause it to stop booting and require
;		a hardware nand flasher to fix. To help prevent people from breaking their softmodded
;		consoles all xell binaries will be scanned for the strings updflash.bin, flashdmp.bin, and
;		updflash.bin and patched out so the update/flash writing features will no longer find and
;		attempt to write to these binaries to the console nand. 
;
;		If you understand the following risks of writing a new nand image to your console:
;			1. Your console only boots with a retail boot chain, meaning you CANNOT use RGH, JTAG,
;				or other forms of NAND images with modified/unsigned boot chains on your console.
;			2. You CANNOT replace system files in flash with unsigned/modified versions as your
;				console will boot with all security/integrity checks enabled.
;			3. You CANNOT downgrade your console to older OS versions that require different lock
;				down values than what your CPU currently has set in its efuses.
;			4. Flashing any image that prevents your console from booting will require you to open
;				your console and solder a hardware nand flasher to fix.
;
;		You can bypass this safety feature by adding the BypassXellScanning key to the OS entry and 
;		give it the value "I Understand This Can Break My Console".
;
; Here's an example entry for xell-2f.bin files found on https://github.com/Free60Project/xell-reloaded:

[BootOption]
Name = "Xell"
FileName = "xell-2f.bin"

; Here's another example for older xell binaries that use a different base address:
;
;[BootOption]
;Name = "Xell R99"
;FileName = "xell-1f.bin"
;BaseAddress = 0x800000001c000000