; This ini file can be used to help install additional homebrew during softmod installation.
; The section name can be anything you want and is ignored (ex: [Aurora], [My Sweet Homebrew Junk], etc.).
;
; Each section should contain the following required values:
;	Category - category to group the item into
;	Name - display name of the item
;	Description - description of the item
;	Source - folder path containing the item files relative to the SoftmodExtras folder
;	Destination - destination path where the item files should be copied to
;
; Each item can contain any of the following optional keys:
;	DashXex - name of the xex file to set as the dashboard path in the softmod config file
;	EjectButtonBehavior - default behavior of the eject button:
;		0 - default eject button behavior
;		1 - boot other OS option
;
;	OtherOSName - name of the default other OS option to boot when EjectButtonBehavior is set to 1
;
; The destination path can use one of the following symlink paths:
;	Hdd1: - \Device\Harddisk0\Partition1
;	HddSys: - \Device\Harddisk0\SystemPartition
;
; Here's an example for installing aurora dashboard from \SoftmodExtras\Aurora to Hdd:\PeerPressure\Dashboard
; and setting the dashboard path in the softmod config file to point to aurora.xex:
;
;[Aurora]
;Category = "Dashboards"
;Name = "Aurora"
;Description = "Installs Aurora dashboard."
;Source = "Aurora"
;Destination = "Hdd1:\PeerPressure\Dashboard"
;DashXex = "Aurora.xex"

; Pre-bundled version of xell:
[Xell]
Category = "Xell"
Name = "Xell"
Description = "Installs xell and sets softmod settings to boot xell when the console is powered on via the eject button."
Source = "Xell"
Destination = "Hdd1:\PeerPressure\OtherOS"
EjectButtonBehavior = 1
OtherOSName = "Xell"